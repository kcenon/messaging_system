name: Generate-Documentation

# Builds the Doxygen documentation as a check only. This workflow used to push
# the output to the gh-pages branch, which no site served (GitHub Pages is
# disabled) and which had grown to 275 MB; the branch was deleted in
# kcenon/messaging_system#249. To publish the documentation again, add an
# actions/upload-pages-artifact + actions/deploy-pages job instead of pushing
# to a branch.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate_docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Cache Doxygen output
        uses: actions/cache@v4
        with:
          path: ./documents/html
          key: ${{ runner.os }}-doxygen-${{ hashFiles('**/*.h', '**/*.cpp', 'Doxyfile') }}
          restore-keys: |
            ${{ runner.os }}-doxygen-

      - name: Generate Documentation
        run: doxygen Doxyfile
